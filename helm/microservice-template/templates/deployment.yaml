apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "microservice.fullname" . }}
  namespace: {{ .Values.service.namespace }}

  labels:
{{ include "microservice.labels" . | indent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "microservice.name" . }}

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "microservice.name" . }}

    spec:

# {{- if .Values.imagePullSecrets }}
#       imagePullSecrets:
# {{- range .Values.imagePullSecrets }}
#         - name: {{ . }}
# {{- end }}
# {{- end }}

# imagePullSecrets intentionally disabled.
# AKS uses AcrPull role assignment against environment ACR.

      serviceAccountName: {{ include "microservice.fullname" . }}

      containers:
        - name: {{ .Values.service.name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

{{- if .Values.health.enabled }}

          livenessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.health.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.liveness.periodSeconds }}

          readinessProbe:
            httpGet:
              path: {{ .Values.health.path }}
              port: {{ .Values.service.targetPort }}

            initialDelaySeconds: {{ .Values.health.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.health.readiness.periodSeconds }}

{{- end }}

          resources:
{{ toYaml .Values.resources | indent 12 }}

          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "{{ .Values.environment.name }}"

{{- if .Values.redis.enabled }}
            - name: REDIS_HOST
              value: "{{ .Values.redis.host }}"

            - name: REDIS_PORT
              value: "{{ .Values.redis.port }}"

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: {{ .Values.redis.passwordKey }}
{{- end }}

{{- if .Values.jwt.enabled }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.secretName }}
                  key: {{ .Values.jwt.key }}
{{- end }}

{{- if .Values.passwordPepper.enabled }}
            - name: PASSWORD_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.passwordPepper.secretName }}
                  key: {{ .Values.passwordPepper.key }}
{{- end }}

{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
{{- end }}