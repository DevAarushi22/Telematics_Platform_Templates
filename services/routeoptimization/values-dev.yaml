replicaCount: 1
image:
  repository: telematicsplatform.azurecr.io/telematicsrouteoptimization
  tag: '1486'
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: routeoptimization-deployment
