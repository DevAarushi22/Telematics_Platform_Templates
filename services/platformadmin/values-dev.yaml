replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsplatformadmin
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: platformadmin
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devplatformadmin.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devplatformadmin-tls
health:
  enabled: false
resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 500m
    memory: 512Mi
env:
  ASPNETCORE_ENVIRONMENT: Development
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password