replicaCount: 1
image:
  repository: telematicsplatform.azurecr.io/telematicsinventorymanagement
  tag: '1467'
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: inventorymanagement-deployment
  namespace: apps
