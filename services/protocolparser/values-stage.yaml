replicaCount: 1
image:
  repository: telematicsacrstgcin01.azurecr.io/telematicsprotocolparser
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrstgcin01
service:
  name: protocolparser
  namespace: apps

  port: 5005
  targetPort: 5005
environment:
  name: Stage
ingress:
  enabled: true
  className: nginx
  host: stageprotocolparser.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-stage-cert-tls
    secretName: stageprotocolparser-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Stage
