replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsprotocolparser
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: protocolparser
  namespace: apps

  port: 5005
  targetPort: 5005
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devprotocolparser.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devprotocolparser-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
