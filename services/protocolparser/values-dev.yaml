replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsprotocolparser
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: protocolparser
  namespace: apps

  port: 5005
  targetPort: 5005
environment:
  name: Development
resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi
ingress:
  enabled: true
  className: nginx
  host: devprotocolparser.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devprotocolparser-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password
