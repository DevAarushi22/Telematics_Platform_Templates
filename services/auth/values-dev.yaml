replicaCount: 1

image:
  repository: telematicsacrdevcin01.azurecr.io/telematicswebauth
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - telematicsacrdevcin01
service:
  name: auth
  namespace: apps

  port: 80
  targetPort: 3000

ingress:
  enabled: true

  className: nginx

  host: devauth.nueralia.ai

  tls:
    secretName: devauth-tls

environment:
  name: Development

health:
  enabled: false
  # enabled: true
  # path: /health

  # liveness:
  #   initialDelaySeconds: 30
  #   periodSeconds: 10

  # readiness:
  #   initialDelaySeconds: 10
  #   periodSeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi

  limits:
    cpu: 250m
    memory: 256Mi

redis:
  enabled: false

jwt:
  enabled: false

passwordPepper:
  enabled: false

env: {}