replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsstorage
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: storage
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devstorage.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devstorage-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password