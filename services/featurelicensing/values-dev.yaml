replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsfeaturelicensing
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: featurelicensing
  namespace: apps

  port: 80
  targetPort: 80
environment:
  name: Development
