  enabled: true
  className: nginx
  host: devfeaturelicensing.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devfeaturelicensing-tls 
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
