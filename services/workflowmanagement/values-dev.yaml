replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsworkflowmanagement
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: workflowmanagement
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devworkflowmanagement.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devworkflowmanagement-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
