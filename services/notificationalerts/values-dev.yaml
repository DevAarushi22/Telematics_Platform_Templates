replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsnotificationalerts
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: notificationalerts
  namespace: apps

  port: 80
