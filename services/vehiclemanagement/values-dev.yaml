replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsvehiclemanagement
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: vehiclemanagement
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi  # Increased from 512Mi to prevent OOMKilled
ingress:
  enabled: true
  className: nginx
  host: devvehiclemanagement.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devvehiclemanagement-tls
health:
  enabled: false
env:
  ASPNETCORE_ENVIRONMENT: Development
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password
