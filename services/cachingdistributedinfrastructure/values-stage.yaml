replicaCount: 1
image:
  repository: telematicsacrstgcin01.azurecr.io/telematicscachingdistributedinfrastructure
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrstgcin01
service:
  name: cachingdistributedinfrastructure
