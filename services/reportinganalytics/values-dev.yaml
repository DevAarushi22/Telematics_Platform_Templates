replicaCount: 1

image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsreportinganalytics
  tag: "latest"
  pullPolicy: Always

imagePullSecrets:
  - name: telematicsacrdevcin01

service:
  name: reportinganalytics
  namespace: apps
  port: 80
  targetPort: 8080

environment:
  name: Development

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi   # Increased from 512Mi to prevent OOMKilled

ingress:
  enabled: true
  className: nginx
  host: devreportinganalytics.nueralia.ai
  tls:
    enabled: true
    secretName: devreportinganalytics-tls

health:
  enabled: false

env:
  ASPNETCORE_ENVIRONMENT: Development