replicaCount: 1
image:
  repository: telematicsacrstgcin01.azurecr.io/telematicsreportinganalytics
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrstgcin01
service:
  name: reportinganalytics
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Stage
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi   # Increased from 512Mi to prevent OOMKilled
ingress:
  enabled: true
  className: nginx
  host: stagereportinganalytics.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-stage-cert-tls
    secretName: stagereportinganalytics-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Stage
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password
