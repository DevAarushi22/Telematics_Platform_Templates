replicaCount: 1
image:
  repository: telematicsacrstgcin01.azurecr.io/telematicsapigateway
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrstgcin01
service:
  name: apigateway
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Stage
ingress:
  enabled: true
  className: nginx
  host: stageapigateway.nueralia.ai
  tls:
    enabled: false
    # secretName: nueralia-dev-cert-tls
    secretName: stageapigateway-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Stage
