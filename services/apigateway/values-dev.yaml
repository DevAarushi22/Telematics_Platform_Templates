replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsapigateway
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: apigateway
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devapigateway.nueralia.ai
  tls:
    enabled: false
    # secretName: nueralia-dev-cert-tls
    secretName: devapigateway-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
