  className: nginx
  host: useraccessmanagement.nueralia.ai
  tls:
    enabled: true
    secretName: nueralia-dev-cert-tls
health:
  enabled: false
resources: {}
env:
  ASPNETCORE_ENVIRONMENT: Development
