replicaCount: 1
image:
  repository: telematicsacrdevcin01.azurecr.io/telematicsuseraccessmanagement
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: useraccessmanagement
  namespace: apps

  port: 80
  targetPort: 8080
environment:
  name: Development
ingress:
  enabled: true
  className: nginx
  host: devuseraccessmanagement.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-dev-cert-tls
    secretName: devuseraccessmanagement-tls
health:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 90
  targetMemoryUtilizationPercentage: 90
env:
  ASPNETCORE_ENVIRONMENT: Development
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password
