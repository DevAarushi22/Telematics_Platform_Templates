replicaCount: 1
image:
  repository: telematicsplatform.azurecr.io/telematicsuseraccessmanagement
  tag: '3302'
  pullPolicy: Always
imagePullSecrets:
- telematicsacrdevcin01
service:
  name: useraccessmanagement-deployment
  namespace: apps
  type: ClusterIP
  port: 80
  targetPort: 80
