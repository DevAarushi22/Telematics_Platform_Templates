replicaCount: 1
image:
  repository: telematicsacrstgcin01.azurecr.io/telematicsuseraccessmanagement
  tag: "latest"
  pullPolicy: Always
imagePullSecrets:
- telematicsacrstgcin01
service:
  name: useraccessmanagement
  namespace: apps

  port: 80
  targetPort: 5087
environment:
  name: Stage
ingress:
  enabled: true
  className: nginx
  host: stageuseraccessmanagement.nueralia.ai
  tls:
    enabled: true
    # secretName: nueralia-stage-cert-tls
    secretName: stageuseraccessmanagement-tls
health:
  enabled: false
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 90
  targetMemoryUtilizationPercentage: 90
env:
  ASPNETCORE_ENVIRONMENT: Stage
redis:
  enabled: true
  host: redis-master.redis.svc.cluster.local
  port: 6379
  secretName: redis-auth
  passwordKey: redis-password
